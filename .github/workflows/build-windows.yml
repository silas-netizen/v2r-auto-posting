name: Build Windows EXE

on:
  push:
    branches:
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[build,test]"

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean v2r-auto-posting.spec

      - name: Upload Windows program
        uses: actions/upload-artifact@v4
        with:
          name: V2R-Auto-Posting-Windows
          path: dist/V2R-Auto-Posting.exe
          if-no-files-found: error

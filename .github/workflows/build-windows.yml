name: Build Windows EXE

on:
  push:
    branches:
      - "cursor/**"
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[build,test]"

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean v2r-cafe-posts.spec
          python -c "import zipfile; zipfile.ZipFile('dist/V2R-Cafe-Posts.zip','w',zipfile.ZIP_DEFLATED).write('dist/V2R-Cafe-Posts.exe','V2R-Cafe-Posts.exe')"

      - name: Upload Windows programs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: V2R-Cafe-Posts-Windows
          path: |
            dist/V2R-Cafe-Posts.exe
            dist/V2R-Cafe-Posts.zip
          if-no-files-found: error
          retention-days: 1

      - name: Attach program to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "ci-exe-${{ github.run_id }}"
          $ok = $false
          foreach ($delay in 4, 8, 16, 32) {
            gh release create $tag dist/V2R-Cafe-Posts.exe dist/V2R-Cafe-Posts.zip --title "Windows EXE ${{ github.sha }}" --notes "CI build from ${{ github.ref_name }}" --target "${{ github.sha }}"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds $delay
          }
          if (-not $ok) { exit 1 }

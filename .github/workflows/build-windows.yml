name: Build Windows EXE

on:
  push:
    branches:
      - "cursor/**"
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

concurrency:
  group: v2r-windows-executable-publish
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[build,test]"

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean v2r-auto-posting.spec
          python -m PyInstaller --noconfirm --clean v2r-auto-affiliate.spec
          python -m PyInstaller --noconfirm --clean v2r-immediate-posting.spec
          python -m PyInstaller --noconfirm --clean v2r-unified-control.spec

      - name: Publish verified executable ZIPs
        if: >-
          github.ref_name == 'cursor/fix-seone-image-upload-3901' ||
          github.ref_name == 'cursor/preserve-excel-row-order-3901'
        shell: pwsh
        run: |
          git fetch origin cursor/image-upload-downloads-3901
          git worktree add --detach publish-executables FETCH_HEAD
          Copy-Item dist/V2R-Affiliate-Revision.exe publish-executables/downloads/V2R-Affiliate-Revision.exe -Force
          Copy-Item dist/V2R-Immediate-Posting.exe publish-executables/downloads/V2R-Immediate-Posting.exe -Force
          Compress-Archive -Path dist/V2R-Affiliate-Revision.exe -DestinationPath publish-executables/downloads/V2R-Affiliate-Revision.zip -CompressionLevel Optimal -Force
          Compress-Archive -Path dist/V2R-Immediate-Posting.exe -DestinationPath publish-executables/downloads/V2R-Immediate-Posting.zip -CompressionLevel Optimal -Force
          Push-Location publish-executables
          git checkout -B cursor/image-upload-downloads-3901
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/V2R-Affiliate-Revision.exe downloads/V2R-Immediate-Posting.exe downloads/V2R-Affiliate-Revision.zip downloads/V2R-Immediate-Posting.zip downloads/verification-row18
          if (git diff --cached --quiet) {
            Write-Host "Executable downloads are already current."
          } else {
            git commit -m "Publish Windows executables from $env:GITHUB_SHA"
            git push origin HEAD:cursor/image-upload-downloads-3901
          }
          Pop-Location

      - name: Remove previous V2R executable artifacts
        if: github.ref_name == 'cursor/fix-seone-image-upload-3901'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const names = new Set([
              "V2R-Auto-Posting-Windows",
              "V2R-Affiliate-Revision",
              "V2R-Immediate-Posting",
            ]);
            for (const artifact of artifacts) {
              if (!names.has(artifact.name)) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
            }
            const caches = await github.paginate(
              "GET /repos/{owner}/{repo}/actions/caches",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            for (const cache of caches) {
              await github.request(
                "DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                },
              );
              core.info(`Deleted old cache: ${cache.key} (${cache.id})`);
            }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2r-auto-posting"
version = "0.1.0"
description = "Google Sheets to V2R posting automation for Windows"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "Pillow>=12.3.0",
  "selenium>=4.34",
  "cryptography>=46.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.14"]
test = ["pytest>=8.4"]

[tool.setuptools]
packages = ["v2r_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
